name: Make TikTok videos

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Kitni videos banani hain"
        default: "3"
      topic:
        description: "Topic (khali = random)"
        default: ""
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Make videos
        env:
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IN_COUNT: ${{ github.event.inputs.count }}
          IN_TOPIC: ${{ github.event.inputs.topic }}
        run: python make_video.py --count "${IN_COUNT:-3}" --topic "${IN_TOPIC:-}"
      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-videos
          path: out/
          retention-days: 14
      - name: Remember used clips
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add used.json || true
          git diff --cached --quiet || (git commit -m "update used clips [skip ci]" && git push)
